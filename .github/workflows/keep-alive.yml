name: Keep Supabase alive

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase edge function
        env:
          PING_URL: ${{ secrets.SUPABASE_PING_URL }}
          PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: curl --fail --silent --show-error -H "Authorization: Bearer $PUBLISHABLE_KEY" "$PING_URL"

      - name: Registrar timestamp (mantém o repositório "ativo")
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-ping.txt
          git config user.name "keep-alive-bot"
          git config user.email "actions@github.com"
          git add last-ping.txt
          git diff --cached --quiet || git commit -m "chore: keep-alive ping $(date -u +%Y-%m-%d)"
          git push
